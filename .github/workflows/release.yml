name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Release hoshi
        id: release-hoshi
        uses: python-semantic-release/python-semantic-release@v10
        with:
          directory: .
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release hoshi-api
        id: release-hoshi-api
        uses: python-semantic-release/python-semantic-release@v10
        with:
          directory: packages/hoshi-api
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish hoshi to GitHub Release
        uses: python-semantic-release/publish-action@v10
        if: steps.release-hoshi.outputs.released == 'true'
        with:
          directory: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release-hoshi.outputs.tag }}

      - name: Build hoshi for PyPI
        run: uv build
        if: steps.release-hoshi.outputs.released == 'true'

      - name: Publish hoshi to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release-hoshi.outputs.released == 'true'

      - name: Publish hoshi-api to GitHub Release
        uses: python-semantic-release/publish-action@v10
        if: steps.release-hoshi-api.outputs.released == 'true'
        with:
          directory: packages/hoshi-api
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release-hoshi-api.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: steps.release-hoshi-api.outputs.released == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        if: steps.release-hoshi-api.outputs.released == 'true'

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2
        if: steps.release-hoshi-api.outputs.released == 'true'

      - name: SAM build
        run: sam build
        if: steps.release-hoshi-api.outputs.released == 'true'

      - name: SAM deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
        if: steps.release-hoshi-api.outputs.released == 'true'

  deploy-ui:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for UI changes
        id: ui-changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(packages/hoshi-ui/|scripts/export_astro_data\.py|hoshi/info\.py)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.ui-changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        if: steps.ui-changes.outputs.changed == 'true'
        run: uv python install 3.13

      - name: Install Python dependencies
        if: steps.ui-changes.outputs.changed == 'true'
        run: uv sync

      - name: Set up Node
        if: steps.ui-changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/hoshi-ui/package-lock.json

      - name: Install Node dependencies
        if: steps.ui-changes.outputs.changed == 'true'
        run: npm ci
        working-directory: packages/hoshi-ui

      - name: Configure AWS credentials
        if: steps.ui-changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy UI
        if: steps.ui-changes.outputs.changed == 'true'
        run: ./deploy-ui.sh
